name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.8
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check solution tests scripts evals
      - name: Ruff format
        run: uv run ruff format --check solution tests scripts evals
      - name: Mypy
        run: uv run mypy
      - name: Flake8
        run: uv run flake8 solution tests scripts evals
      - name: Bandit
        run: uv run bandit -r solution scripts evals -q

  tests:
    name: Tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.8
      - run: uv sync --frozen
      - name: Ensure Rust compiler
        run: |
          if ! command -v rustc >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends rustc
          fi
          rustc --version
      - name: Offline tests and coverage
        run: >-
          uv run python -m pytest --cov=solution --cov-branch
          --cov-report=term-missing --cov-report=json:coverage.json
          --cov-report=xml:coverage.xml --cov-report=html:htmlcov
          --junitxml=junit.xml -q
      - name: Require 95% lines AND 95% branches
        run: uv run python scripts/check_coverage.py coverage.json
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.json ]; then
            uv run python scripts/check_coverage.py coverage.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-python-${{ matrix.python }}
          path: |
            coverage.json
            coverage.xml
            htmlcov/
            junit.xml
          retention-days: 14

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build --target runtime -t aithena-solution .
      - run: docker run --rm aithena-solution --help
      - run: docker build --target rust-validator -t aithena-rust-validator:local .
      - name: Isolated Rust compiler smoke test
        run: |
          printf 'pub fn foo() {}' | docker run --rm -i --network=none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges --memory=256m \
            --tmpfs=/tmp:rw,noexec,nosuid,size=32m,mode=1777 \
            aithena-rust-validator:local sh -c \
            'cat > /tmp/lib.rs && rustc --edition=2021 --crate-type=lib --emit=metadata /tmp/lib.rs -o /tmp/lib.rmeta'

  live:
    name: Live LLM regression
    needs: [quality, tests, docker]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.8
      - run: uv sync --frozen
      - name: Ensure Rust compiler
        run: |
          if ! command -v rustc >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends rustc
          fi
          rustc --version
      - run: docker build --target rust-validator -t aithena-rust-validator:local .
      - name: Complete pytest suite including real API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: gpt-5.4-mini-2026-03-17
          RUN_LLM_TESTS: '1'
        run: |
          test -n "$OPENAI_API_KEY" || { echo 'OPENAI_API_KEY secret is missing'; exit 1; }
          uv run python -m pytest --cov=solution --cov-branch \
            --cov-report=term-missing --cov-report=json:live-coverage.json \
            --junitxml=live-junit.xml -q
          uv run python scripts/check_coverage.py live-coverage.json
      - name: Analysis dataset (30 cases x 3 repeats)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: gpt-5.4-mini-2026-03-17
        run: >-
          uv run python -m evals.run --prompt-version v3 --settings temperature-zero
          --split all --repeats 3 --workers 3 --output ci-results/analysis.json
      - name: Rust behavior dataset (5 cases x 3 repeats)
        if: ${{ !cancelled() }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: gpt-5.4-mini-2026-03-17
        run: >-
          uv run python -m evals.run --prompt-version v3 --settings temperature-zero
          --kind translation --repeats 3 --workers 3 --output ci-results/translation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-llm-results
          path: |
            ci-results/
            live-coverage.json
            live-junit.xml
          retention-days: 30

  required:
    name: CI required
    if: always()
    needs: [quality, tests, docker, live]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required job results
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          DOCKER: ${{ needs.docker.result }}
          LIVE: ${{ needs.live.result }}
          REQUIRE_LIVE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: |
          test "$QUALITY" = success
          test "$TESTS" = success
          test "$DOCKER" = success
          if [ "$REQUIRE_LIVE" = true ]; then
            test "$LIVE" = success
          fi
