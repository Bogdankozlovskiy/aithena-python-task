[project]
name = "aithena-solution"
version = "0.1.0"
description = "LLM-based source license analysis and conditional Rust translation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langchain-openai>=1,<2",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8,<2",
    "flake8>=7,<8",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.11,<1",
]

[project.scripts]
aithena = "solution.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires paid LLM API access and rustc"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.coverage.run]
branch = true
source = ["solution"]

[tool.coverage.report]
fail_under = 95
precision = 2
show_missing = true

[tool.mypy]
python_version = "3.13"
files = ["solution", "evals", "scripts"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
